name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  container-job:
    runs-on: ubuntu-latest
    # libvips >= 8.16 is required, ubuntu-latest ships an older one
    container: golang:1.25-trixie

    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install libvips
        run: apt-get update && apt-get install -y --no-install-recommends libvips-dev

      - name: Build
        run: make build

      - name: Test
        run: make test
        env:
          REDIS_HOST: redis
          REDIS_PORT: 6379
